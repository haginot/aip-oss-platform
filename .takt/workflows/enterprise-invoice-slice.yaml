      slice-01-plan.mdに従いENT-202候補だけを実装する。請求書取込・実発注/検収との三点照合・不一致の拒否/例外処理・多段/職務分離承認・synthetic支払送信・結果照合を公開API/実ブラウザで完走する。重複請求、金額通貨数量/検収不一致、承認後改変/口座変更、他部門/他tenant/閲覧者、分類取消/承認者権限失効、競合/再送、監査失敗rollback、再起動/送信結果不明を意味のあるassertionで検査する。実送金を行わない。
      実データ源はENT-201公開契約を通った発注・検収とする。direct-DB business bypass、stubの合格、権限や承認を省く実装を禁止する。必要な小さい公開契約拡張は許されるが、他業務の再実装や全体基盤の再設計は範囲外。既存ENT-201両suiteと変更対象の安全基盤回帰を現在コードで実行し、R1(古いSQL復元の安全停止)・R2(分類取消の応答/DOM漏えい拒否)を維持する。
      テストはplan既存要求名と実assertionを対応付け、4ACを行動と現行input hashに結ぶ。固有出力先で実コマンド、開始終了、exit、TAP tests/pass/fail/cancelled/skipped/todo、ソースとテスト定義のhash、成果物hash、実HTTP/DOM/ledgerを保存する。失敗ログは保全する。限定成果のみ報告し、正式gate/依存承認や全体PASSを付与しない。
    quality_gates:
      - type: command
        name: ENT-202-api
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-202-slice-20261027/gates/implement-api mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-202.test.mjs
        cwd: .
        timeout_ms: 600000
      - type: command
        name: ENT-202-browser
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-202-slice-20261027/gates/implement-browser mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-202.browser.test.mjs
        cwd: .
        timeout_ms: 600000
      - type: command
        name: ENT-201-regression
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-202-slice-20261027/gates/implement-purchase-regression mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-201.test.mjs tests/enterprise/ENT-201.browser.test.mjs
        cwd: .
        timeout_ms: 600000
    output_contracts:
      report:
        - name: slice-02-implementation.md
          format: |
            # ENT-202 candidate implementation
            ## Changes and four-AC mapping
            ## Actual commands, exits, assertions and hashes
            ## Negative and recovery cases
            ## Unmet dependencies and acceptance limits
    rules:
      - condition: The scoped candidate has passed its real API and browser tests and is ready for independent review
        next: slice-review
      - condition: Implementation or tests are incomplete, blocked or require work outside the fixed scope
        next: ABORT
        command_gates: skip
