      ENT-202原本4AC、依存安全契約、実コードと実API/ブラウザ証拠をAstraで独立確認する。三点照合が実ENT-201発注/検収に結び付くこと、請求の重複/競合/過払い、金額通貨数量・検収、口座の現在性と承認binding/職務分離、workerのoperation分離と送信冪等性、UNKNOWN GET照合、SQL復旧、認可取消とHTTP/DOM除外、監査永続性を重点に確認する。保存証拠と現行hashの不一致・不足を合格扱いしない。可能な再現には既存suiteと新規固有出力先を用い、過去の出力を変えない。
      既存ENT-201 API/browser回帰と安全な基盤の回帰を確認し、既存テストの削除/弱体化で通していないことを比較する。要求されたTAP名が存在するだけでなく本来のassertionを持つことを確認する。限定候補と正式受入不足を明示する。修正は最大1回だけ、同範囲・残予算で直せる具体的指摘に限る。不可欠な安全契約欠如や範囲外の必要作業はABORTとする。
    output_contracts:
      report:
        - name: slice-03-review.md
          format: |
            # Independent ENT-202 candidate review
            ## Candidate verdict and four-AC evidence
            ## Reproduced blocking findings
            ## Exact hashes and reviewer session
            ## Outstanding formal acceptance
    rules:
      - condition: The ENT-202 candidate behavior passes scoped independent review with all remaining formal acceptance explicitly recorded
        next: COMPLETE
      - condition: Concrete findings can be corrected within this same ENT-202 slice and remaining budget
        next: slice-repair
      - condition: Missing contracts or findings require work beyond this slice or the remaining budget
        next: ABORT
