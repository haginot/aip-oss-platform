name: enterprise-invoice-slice
description: Timeboxed ENT-202 invoice matching/payment approval candidate using actual ENT-201 public order/receipt contracts; formal acceptance remains pending.
max_steps: 5
initial_step: slice-plan
steps:
  - name: slice-plan
    session_key: enterprise-invoice-slice-planner-20261027
    persona: platform-architect
    capabilities: readonly
    edit: false
    instruction: |-
      日本語で公開報告を書く。固定上限は5工程・修正1回・開始から90分。正式受入と限定候補を区別し、計画/Issue/旧progressを変更せず、現在の依存承認を捏造しない。実送金・実データ・外部メッセージ・課金追加・credential変更・push/公開/PRは禁止。旧全体タスクを再開しない。
      前のENT-201はrun 20261026233229-50606ffdの独立レビューで限定候補のみCOMPLETEとなった。正式suite接続と13依存の現行受入は未達であり、承認を継承しない。ENT-201の実API purchaseRead、発注operation、RECEIVED検収データを実際に再利用し、請求書専用の架空PO/検収を代用しない。既存コード・テスト・失敗ログ・証跡を保全する。前runの入力digestは歴史として保持し、新しいコードへ流用しない。
      保護対象3ファイルと /Users/haginota/.takt/state/projects/1f55f464-a70a-4f4e-abd5-68720a923e59/supervision/20261027-takeover/ENT-202-protected-history.json の全472ファイルを変更しない。新規実行は固有の出力directoryへ記録し、ENT-201の既存証跡を上書きしない。安全契約・原本AC・既存assertionを弱めて通さない。基盤の不可欠な契約が欠ける場合は最小再現でABORTし、証跡整備の往復や基盤全体の再設計へ戻らない。

      ENT-202「請求書照合・支払承認」だけを対象に、原本 work/enterprise/issues/ENT-202.md の4ACとplan内の既存suite契約を読む。請求書取込→実発注/検収との三点照合→例外処理→職務分離による支払承認→synthetic送信・結果照合をAPI/実ブラウザで通す具体案を作る。金額/通貨/数量/仕入先/支払口座の一致、重複請求・部分/累積支払による過払いの拒否、口座変更による承認失効、検収不一致と隔離、失効時認可、送信結果不明の照合を設計する。
      現行public Kernel/Action/Outbox/Audit/認可/承認/workerに接続し、外部副作用は既存local synthetic portだけに限定する。支払と発注のoperation種別・宛先・idempotency bindingを分離し、UNKNOWN時の自動再送を禁止する。古いSQL復元や権限分類取消でENT-201のR1/R2修正を後退させない。実在する安全契約と未承認依存を分け、90分内に安全な一業務候補を作れなければABORTする。
      必要な実テストは tests/enterprise/ENT-202.test.mjs と ENT-202.browser.test.mjs。planの要求名(AC-01〜04, positive, negative-authorization, persistence, failure-recovery とブラウザ4分類)を満たす実assertionを初回から対応付ける。既存manifest/hash/TAP記録を利用し、新しい検証基盤は作らない。
    output_contracts:
      report:
        - name: slice-01-plan.md
          format: |
            # ENT-202 bounded implementation plan
            ## Four ACs and executable checks
            ## Existing and missing dependency contracts
            ## Exact implementation scope
            ## Remaining acceptance and blockers
    rules:
      - condition: A safe concrete ENT-202 candidate can be implemented within the fixed scope
        next: slice-implement
      - condition: Safe implementation requires work outside this slice or an unresolved indispensable prerequisite
        next: ABORT
  - name: slice-implement
    session_key: enterprise-invoice-slice-builder-20261027
    persona: platform-engineer
    capabilities: edit
    edit: true
    instruction: |-
      日本語で公開報告を書く。固定上限は5工程・修正1回・開始から90分。正式受入と限定候補を区別し、計画/Issue/旧progressを変更せず、現在の依存承認を捏造しない。実送金・実データ・外部メッセージ・課金追加・credential変更・push/公開/PRは禁止。旧全体タスクを再開しない。
