      必要な実テストは tests/enterprise/ENT-201-quantity.test.mjs と ENT-201-quantity.browser.test.mjs。APIは positive / negative-authorization / persistence / failure-recovery の4分類を意味のある実assertionに対応付け、無効値、単位/数量不一致、承認後改変、独立検収拒否、重複/競合、権限分類取消、旧数量なし契約、監査失敗、UNKNOWNと復旧を検査する。ブラウザは real-browser-interaction / japanese-keyboard-error-recovery / forbidden-data-absent-in-response-and-dom / persistent-history-after-reload を実操作・HTTP・DOM・ledgerで対応付ける。既存ENT-201 API/browserを現行コードで必須回帰し、変更した安全基盤の関連回帰を追加する。

      slice-03-review.mdの具体的指摘だけを直す唯一の修正工程。新規数量API/browser、既存ENT-201 API/browserと影響する安全回帰を再実行し、新たな修正出力先へ実コマンド・TAP・現行input/output hashと原因解消の根拠を記録する。旧失敗を保持する。同原因が残る・予算不足・基盤全体の移行が必要ならABORTし、追加修正は行わない。
