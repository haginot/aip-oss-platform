      1. 実公開APIと購買画面から正の安全な整数の発注数量・明示した単位を入力し、同一仕様（数量/単位等）の相見積を比較・選定する。選定金額/通貨/数量/単位/仕入先/見積版を承認対象に結合し、承認後変更は拒否または旧承認を確実に失効させる。数量1の固定、自由記述noteからの数量推測は禁止。
      2. 実際の発注Action/operationとsynthetic外部ledger payloadが承認済み数量/単位へ結合する。独立受領者が構造化した実検収数量を記録し、purchaseRead等の実公開契約で発注数量/単位/検収数量/元operation/版を取得できる。今回は単一明細の全量検収までとし、部分検収/過剰検収/不一致を明示的に拒否する。拒否は成功や数量0/1に変換しない。
      3. 既存数量なしレコード/既存manifest/旧fixtureとの互換を明示する。既存呼出しが試験どおり動いても、未記録数量はunknown/absentとして取得され、数量付き三点照合に利用不可と識別できること。旧承認や履歴を移行で捏造せず、旧版の処理安全性を維持する。公開契約のversion/digestの安全な扱いを決める。互換が広範な移行を要するならABORTする。
