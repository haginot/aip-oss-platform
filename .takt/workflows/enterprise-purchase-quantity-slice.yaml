    quality_gates:
      - type: command
        name: purchase-quantity-api
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-201-quantity-slice-20261027/gates/implement-api mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-201-quantity.test.mjs
        cwd: .
        timeout_ms: 600000
      - type: command
        name: purchase-quantity-browser
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-201-quantity-slice-20261027/gates/implement-browser mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-201-quantity.browser.test.mjs
        cwd: .
        timeout_ms: 600000
      - type: command
        name: ENT-201-regression
        command: ENTERPRISE_SUITE_OUTPUT=evidence/enterprise/ENT-201-quantity-slice-20261027/gates/implement-purchase-regression mise exec -- node --test --test-reporter=tap tests/enterprise/ENT-201.test.mjs tests/enterprise/ENT-201.browser.test.mjs
        cwd: .
        timeout_ms: 600000
    output_contracts:
      report:
        - name: slice-02-implementation.md
          format: |
            # Purchase quantity/receipt prerequisite candidate implementation
            ## Changes and contract acceptance mapping
            ## Actual commands, exits, assertions and hashes
            ## Negative and recovery cases
            ## Unmet dependencies and acceptance limits
    rules:
      - condition: The scoped candidate has passed its real API and browser tests and is ready for independent review
        next: slice-review
      - condition: Implementation or tests are incomplete, blocked or require work outside the fixed scope
        next: ABORT
        command_gates: skip
