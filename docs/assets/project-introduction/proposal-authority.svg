<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Separate AI proposals from execution authority</title><desc id="desc">Authorized retrieval feeds a typed proposal. The Action Engine rechecks actor, delegation, revision, approval and idempotency.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#2697FC" stroke-width="1.3"/></marker></defs><rect width="1600" height="840" fill="#FFFFFF"/><g font-family="Arial,'Hiragino Sans','Noto Sans JP',sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="60" y="55" font-size="17" font-weight="500" fill="#3775E6" text-anchor="start">AUTHORITY BOUNDARY / 03</text><text x="60" y="111" font-size="42" font-weight="600" fill="#434343" text-anchor="start">A proposal is not permission to execute.</text><text x="60" y="151" font-size="21" font-weight="400" fill="#434343" text-anchor="start">AI produces proposals. Every execution request is checked at the Action boundary.</text><path d="M60 182L1540 182" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><text x="277" y="239" font-size="22" font-weight="500" fill="#434343" text-anchor="middle">AUTHORIZED EVIDENCE</text><text x="723" y="239" font-size="22" font-weight="500" fill="#434343" text-anchor="middle">TYPED PROPOSAL</text><text x="1265" y="239" font-size="22" font-weight="500" fill="#434343" text-anchor="middle">GOVERNED EXECUTION</text><polygon points="100,466 455,466 455,479 100,479" fill="#ECECEC" stroke="#CCCCCC" stroke-width="1.3" stroke-linejoin="round"/><polygon points="100,466 135,340 420,340 455,466" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.3" stroke-linejoin="round"/><path d="M108 468L104 477" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M120 468L116 477" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M132 468L128 477" fill="none" st