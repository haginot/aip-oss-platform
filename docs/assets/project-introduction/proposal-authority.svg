xt-anchor="middle">ACTION BOUNDARY</text><text x="277" y="518" font-size="24" font-weight="500" fill="#434343" text-anchor="middle">Retrieve as a verified actor</text><text x="277" y="554" font-size="21" font-weight="400" fill="#434343" text-anchor="middle">Only permitted information</text><text x="723" y="518" font-size="24" font-weight="500" fill="#434343" text-anchor="middle">Propose with evidence</text><text x="723" y="554" font-size="21" font-weight="400" fill="#434343" text-anchor="middle">No execution authority granted</text><text x="1265" y="518" font-size="25" font-weight="500" fill="#434343" text-anchor="middle">Action Engine</text><text x="1265" y="554" font-size="21" font-weight="400" fill="#434343" text-anchor="middle">Recheck at execution time</text><rect x="1065" y="588" width="404" height="112" fill="#FFFFFF" stroke="#FD9941" stroke-width="1.3"/><text x="1087" y="621" font-size="20" font-weight="400" fill="#434343" text-anchor="start">Actor / Authority / Delegation</text><text x="1087" y="653" font-size="19" font-weight="400" fill="#434343" text-anchor="start">Expected revision / Constraints / Approval</text><text x="1087" y="683" font-size="19" font-weight="400" fill="#434343" text-anchor="start">Idempotency / Duplicate request checks</text><rect x="100" y="612" width="795" height="68" fill="#EEF3FD" stroke="#CCCCCC" stroke-width="1.3"/><text x="497" y="641" font-size="21" font-weight="500" fill="#434343" text-anchor="middle">Retrieval permission and execution permission are checked separately.</text><text x="497" y="667" font-size="18" font-weight="400" fill="#434343" text-anchor="middle">Denied operations do not execute.</text><path d="M60 771L1540 771" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><text x="60" y="810" font-size="17" font-weight="400" fill="#434343" text-anchor="start">Design boundary / No production runtime AI model has been adopted</text><text x="1540" y="810" font-size="17" font-weight="500" fill="#A8A8A8" text-anchor="end">AIP–OSS / 03</text></g></svg>
