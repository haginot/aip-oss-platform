<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1124" viewBox="0 0 640 1124" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Ontology: types and relationships</title><desc id="desc">Store, lot, and inventory Objects connect to the SetIsolation Action. A DDD reading links ubiquitous language to typed models. Expected revision r7 permits checks when current is r7; current r8 rejects the stale assumption.</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#CCCCCC" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#434343" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1124" rx="2" fill="#FFFFFF"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#3775E6"/><text x="51" y="54" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="500"><tspan x="51" dy="0">02</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#434343" font-size="26" font-weight="600"><tspan x="96" dy="0">Ontology: types and relationships</tspan></text>
<rect x="24" y="112" width="250" height="100" rx="2" fill="#FFFFFF"/><rect x="24" y="112" width="5" height="100" rx="2.5" fill="#3775E6"/><text x="149" y="153" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="149" dy="0">Store Object</tspan><tspan x="149" dy="34">Example: store A</tspan></text><rect x="366" y="112" width="250" height="100" rx="2" fill="#FFFFFF"/><rect x="366" y="112" width="5" height="100" rx="2.5" fill="#3775E6"/><text x="491" y="153" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="491" dy="0">Lot Object</tspan><tspan x="491" dy="34">Example: lot L1</tspan></text><path d="M149 212 V250 H260 V310" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M491 212 V250 H380 V310" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><text x="149" y="289" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="149" dy="0">Holds stock</tspan></text><text x="491" y="289" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="491" dy="0">Recalled lot</tspan></text><rect x="130" y="310" width="380" height="126" rx="2" fill="#EEF3FD"/><rect x="130" y="310" width="5" height="126" rx="2.5" fill="#3775E6"/><text x="320" y="347" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Inventory Object</tspan><tspan x="320" dy="34">Store A × lot L1</tspan><tspan x="320" dy="34">Expected revision: r7</tspan></text><path d="M320 436 V492" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="492" width="592" height="100" rx="2" fill="#EEF3FD"/><text x="320" y="533" text-anchor="middle" fill="#3775E6" font-size="24" font-weight="500"><tspan x="320" dy="0">Typed quarantine Action</tspan><tspan x="320" dy="34">SetIsolation</tspan></text><text x="320" y="647" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Shared types for APIs and business rules</tspan></text>
<path d="M24 690 H616" stroke="#CCCCCC" stroke-width="2"/><text x="320" y="738" text-anchor="middle" fill="#3775E6" font-size="26" font-weight="500"><tspan x="320" dy="0">A DDD reading</tspan></text><rect x="24" y="768" width="592" height="110" rx="2" fill="#EEF3FD"/><text x="320" y="814" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Domain vocabulary = type / API vocabulary</tspan><tspan x="320" dy="34">A model informed by ubiquitous language</tspan></text><text x="320" y="926" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Revision check: reject a stale assumption</tspan></text><rect x="24" y="960" width="270" height="114" rx="2" fill="#EEF3FD"/><text x="159" y="1008" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">Expect r7; got r7</tspan><tspan x="159" dy="34">Check, then update</tspan></text><rect x="346" y="960" width="270" height="114" rx="2" fill="#FFF7EF"/><text x="481" y="1008" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">Expect r7; got r8</tspan><tspan x="481" dy="34">Reject the conflict</tspan></text></g></svg>
