<svg xmlns="http://www.w3.org/2000/svg" width="640" height="914" viewBox="0 0 640 914" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">TAKT: implement, then review</title><desc id="desc">TAKT moves from goals and design to implementation and machine checks, then to independent review in another session. Rejection returns to the causal stage; approval permits completion. Changed inputs invalidate an older PASS.</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#CCCCCC" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#434343" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="914" rx="2" fill="#FFFFFF"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#3775E6"/><text x="51" y="54" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="500"><tspan x="51" dy="0">07</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#434343" font-size="26" font-weight="600"><tspan x="96" dy="0">TAKT: implement, then review</tspan></text>
<rect x="60" y="110" width="520" height="104" rx="2" fill="#FFFFFF"/><rect x="60" y="110" width="5" height="104" rx="2.5" fill="#3775E6"/><text x="320" y="153" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Goals / design / plan</tspan><tspan x="320" dy="34">Define acceptance and contracts</tspan></text><path d="M320 214 V272" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="60" y="272" width="520" height="134" rx="2" fill="#EEF3FD"/><rect x="60" y="272" width="5" height="134" rx="2.5" fill="#3775E6"/><text x="320" y="330" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Implementation and machine checks</tspan><tspan x="320" dy="34">Store demo / BCP / release preparation</tspan></text><path d="M320 406 V466" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="60" y="466" width="520" height="104" rx="2" fill="#FFFFFF"/><rect x="60" y="466" width="5" height="104" rx="2.5" fill="#3775E6"/><text x="320" y="509" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Independent review</tspan><tspan x="320" dy="34">in another session</tspan></text><path d="M320 570 V604 H159 V650" fill="none" stroke="#434343" stroke-width="3" marker-end="url(#amber-arrow)"/><path d="M320 604 H481 V650" fill="none" stroke="#3775E6" stroke-width="3" marker-end="url(#green-arrow)"/><rect x="24" y="650" width="270" height="104" rx="2" fill="#FFF7EF"/><rect x="24" y="650" width="5" height="104" rx="2.5" fill="#434343"/><text x="159" y="693" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">Rejected</tspan><tspan x="159" dy="34">Fix causal stage</tspan></text><rect x="346" y="650" width="270" height="104" rx="2" fill="#EEF3FD"/><rect x="346" y="650" width="5" height="104" rx="2.5" fill="#3775E6"/><text x="481" y="693" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">Approved</tspan><tspan x="481" dy="34">May complete</tspan></text><rect x="24" y="798" width="592" height="80" rx="2" fill="#EEF3FD"/><text x="320" y="846" text-anchor="middle" fill="#3775E6" font-size="24" font-weight="500"><tspan x="320" dy="0">Changed inputs invalidate an older PASS</tspan></text>
