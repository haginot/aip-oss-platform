ke="#434343" stroke-width="1.3"/><circle cx="-24" cy="-46" r="4" fill="#3775E6" stroke="#3775E6" stroke-width="1.3"/><path d="M-11 -46L26 -46" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><rect x="-24" y="-50" width="78" height="45" fill="#FFFFFF" stroke="#434343" stroke-width="1.3"/><circle cx="-10" cy="-28" r="4" fill="#FD9941" stroke="#FD9941" stroke-width="1.3"/><path d="M3 -28L40 -28" fill="none" stroke="#CCCCCC" stroke-width="1.4"/></g><text x="614" y="416" font-size="23" font-weight="500" fill="#434343" text-anchor="middle">Outbox</text><g transform="translate(1275 377) scale(0.83)"><path d="M-42 -70V0C-42 24 42 24 42 0V-70" fill="#FFFFFF" stroke="#434343" stroke-width="1.3"/><ellipse cx="0" cy="-70" rx="42" ry="15" fill="#EEF3FD" stroke="#434343" stroke-width="1.3"/><path d="M-42 -48C-42 -24 42 -24 42 -48" fill="none" stroke="#434343" stroke-width="1.3"/><path d="M-42 -25C-42 -1 42 -1 42 -25" fill="none" stroke="#434343" stroke-width="1.3"/><path d="M-42 0C-42 24 42 24 42 0" fill="none" stroke="#434343" stroke-width="1.3"/><circle cx="27" cy="-18" r="3" fill="#3775E6" stroke="#3775E6" stroke-width="1.3"/></g><text x="1275" y="416" font-size="23" font-weight="500" fill="#434343" text-anchor="middle">ERP / WMS</text><path d="M743 340H1060" fill="none" stroke="#2697FC" stroke-width="1.8" marker-end="url(#arrow)"/><text x="900" y="315" font-size="21" font-weight="500" fill="#434343" text-anchor="middle">確定後に送信</text><path d="M1060 397H963M915 397H743" fill="none" stroke="#FD9941" stroke-width="1.7" stroke-dasharray="6 6"/><path d="M927 385L951 409" fill="none" stroke="#FD9941" stroke-width="2.5"/><path d="M951 385L927 409" fill="none" stroke="#FD9941" stroke-width="2.5"/><text x="900" y="443" font-size="20" font-weight="400" fill="#434343" text-anchor="middle">成功応答を消失</text><path d="M990 494L990 730" fill="none" stroke="#CCCCCC" stroke-width="1.3" stroke-dasharray="5 7"/><text x="420" y="493" font-size="21" font-weight="400" fill="#434343" text-anchor="middle">Object + Action + Outboxを同時に確定</text><text x="1275" y="493" font-size="21" font-weight="400" fill="#434343" text-anchor="middle">外部では処理済み</text><rect x="112" y="540" width="617" height="128" fill="#FFF7EF" stroke="#FD9941" stroke-width="1.3"/><text x="145" y="580" font-size="29" font-weight="600" fill="#434343" text-anchor="start">UNKNOWN</text><text x="145" y="617" font-size="23" font-weight="400" fill="#434343" text-anchor="start">失敗と決めつけず、無条件に再送しない</text><text x="145" y="647" font-size="20" font-weight="400" fill="#434343" text-anchor="start">外部の証拠で、結果を確認する</text><path d="M743 599H1060" fill="none" stroke="#2697FC" stroke-width="1.8" marker-end="url(#arrow)"/><text x="906" y="575" font-size="21" font-weight="500" fill="#434343" text-anchor="middle">Reconcile</text><rect x="1080" y="540" width="389" height="128" fill="#FFFFFF" stroke="#3775E6" stroke-width="1.3"/><text x="1110" y="580" font-size="24" font-weight="500" fill="#434343" text-anchor="start">外部記録と照合</text><text x="1110" y="615" font-size="22" font-weight="400" fill="#434343" text-anchor="start">Operation ID</text><text x="1110" y="647" font-size="22" font-weight="400" fill="#434343" text-anchor="start">+ Input digest</text><path d="M1080 706H732" fill="none" stroke="#2697FC" stroke-width="1.7" marker-end="url(#arrow)"/><text x="901" y="740" font-size="20" font-weight="400" fill="#434343" text-anchor="middle">確認できなければ UNKNOWN のまま</text><path d="M60 784L1540 784" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><text x="60" y="827" font-size="24" font-weight="500" fill="#434343" text-anchor="start">冪等性 / 同じ依頼を見分ける</text><rect x="60" y="860" width="700" height="89" fill="#EEF3FD" stroke="#CCCCCC" stroke-width="1.3"/><rect x="800" y="860" width="740" height="89" fill="#FFF7EF" stroke="#CCCCCC" stroke-width="1.3"/><text x="86" y="895" font-size="23" font-weight="500" fill="#434343" text-anchor="start">同じID・同じ入力</text><text x="86" y="928" font-size="21" font-weight="400" fill="#434343" text-anchor="start">既存の結果を返す</text><text x="827" y="895" font-size="23" font-weight="500" fill="#434343" text-anchor="start">同じID・違う入力</text><text x="827" y="928" font-size="21" font-weight="400" fill="#434343" text-anchor="start">競合として拒否する</text><path d="M60 991L1540 991" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><text x="60" y="1030" font-size="17" font-weight="400" fill="#434343" text-anchor="start">外部まで含む単一トランザクションや、無条件の exactly-once は主張しません。</text><text x="1540" y="1030" font-size="17" font-weight="500" fill="#A8A8A8" text-anchor="end">AIP–OSS / 04</text></g></svg>
