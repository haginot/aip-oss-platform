<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">外部成功後の応答消失と復旧</title><desc id="desc">ローカル確定後に外部へ送る。応答が消えればUNKNOWNとして保持。操作IDと入力ダイジェストで照合し、同じIDの違う入力は拒否する。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#2697FC" stroke-width="1.3"/></marker></defs><rect width="1600" height="1060" fill="#FFFFFF"/><g font-family="Arial,'Hiragino Sans','Noto Sans JP',sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="60" y="55" font-size="17" font-weight="500" fill="#3775E6" text-anchor="start">DELIVERY &amp; RECOVERY / 04</text><text x="60" y="111" font-size="42" font-weight="600" fill="#434343" text-anchor="start">成功したのに、応答がない。</text><text x="60" y="151" font-size="21" font-weight="400" fill="#434343" text-anchor="start">ローカルの原子性と、外部システムへの反映は別の問題。</text><path d="M60 182L1540 182" fill="none" stroke="#CCCCCC" stroke-width="1.4"/><text x="419" y="238" font-size="23" font-weight="500" fill="#434343" text-anchor="middle">同じローカルトランザクション</text><text x="1275" y="238" font-size="23" font-weight="500" fill="#434343" text-anchor="middle">外部は別トランザクション</text><polygon points="112,439 729,439 729,452 112,452" fill="#ECECEC" stroke="#CCCCCC" stroke-width="1.3" stroke-linejoin="round"/><polygon points="112,439 160,296 681,296 729,439" fill="#EEF3FD" stroke="#CCCCCC" stroke-width="1.3" stroke-linejoin="round"/><path d="M120 441L116 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M132 441L128 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M144 441L140 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M156 441L152 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M168 441L164 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M180 441L176 450" fill="none" stroke="#CCCCCC" stroke-width="0.7"/><path d="M192 441L188 450"