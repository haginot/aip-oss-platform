<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1346" viewBox="0 0 640 1346" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">止めて、戻して、確かめる</title><desc id="desc">BCP演習で成功、未実行、競合、不明を分類し、損失、重複、RPOとRTOを測る。現行の現在状態と履歴・索引の方式を、順序付きイベントのReplayで状態を再構築するイベントソーシングの理論モデルと比較する。下段は未採用の比較。</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#CCCCCC" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#434343" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1346" rx="2" fill="#FFFFFF"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#3775E6"/><text x="51" y="54" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="500"><tspan x="51" dy="0">06</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#434343" font-size="26" font-weight="600"><tspan x="96" dy="0">止めて、戻して、確かめる</tspan></text>
<rect x="24" y="112" width="270" height="112" rx="2" fill="#FFF7EF"/><rect x="24" y="112" width="5" height="112" rx="2.5" fill="#434343"/><text x="159" y="159" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">通信断・停止</tspan><tspan x="159" dy="34">障害を起こす</tspan></text><path d="M294 168 H346" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="112" width="270" height="112" rx="2" fill="#FFFFFF"/><rect x="346" y="112" width="5" height="112" rx="2.5" fill="#3775E6"/><text x="481" y="159" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">再起動・復元</tspan><tspan x="481" dy="34">状態を読み直す</tspan></text><path d="M481 224 V255 H159 V304" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M481 255 V304" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="304" width="270" height="104" rx="2" fill="#EEF3FD"/><rect x="24" y="304" width="5" height="104" rx="2.5" fill="#3775E6"/><text x="159" y="347" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">成功</tspan><tspan x="159" dy="34">完了を確認</tspan></text><rect x="346" y="304" width="270" height="104" rx="2" fill="#FFFFFF"/><rect x="346" y="304" width="5" height="104" rx="2.5" fill="#3775E6"/><text x="481" y="347" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">未実行</tspan><tspan x="481" dy="34">未反映を確認</tspan></text><rect x="24" y="436" width="270" height="104" rx="2" fill="#FFF7EF"/><rect x="24" y="436" width="5" height="104" rx="2.5" fill="#434343"/><text x="159" y="479" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">競合</tspan><tspan x="159" dy="34">状態に差分</tspan></text><rect x="346" y="436" width="270" height="104" rx="2" fill="#FFF7EF"/><rect x="346" y="436" width="5" height="104" rx="2.5" fill="#434343"/><text x="481" y="479" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">不明</tspan><tspan x="481" dy="34">判断を保留</tspan></text><text x="320" y="277" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">復旧後の結果を分類</tspan></text><rect x="24" y="582" width="592" height="80" rx="2" fill="#EEF3FD"/><text x="320" y="630" text-anchor="middle" fill="#3775E6" font-size="24" font-weight="500"><tspan x="320" dy="0">損失・重複・未解決 / RPO・RTO</tspan></text><text x="320" y="708" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">ローカル演習。本番SLAの保証ではない</tspan></text>
<path d="M24 758 H616" stroke="#CCCCCC" stroke-width="2"/><text x="320" y="806" text-anchor="middle" fill="#3775E6" font-size="26" font-weight="500"><tspan x="320" dy="0">履歴がある ≠ Event Sourcing</tspan></text><text x="320" y="860" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">現行：現在状態を保存する</tspan></text><rect x="24" y="894" width="270" height="102" rx="2" fill="#EEF3FD"/><text x="159" y="936" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">Objects</tspan><tspan x="159" dy="34">現在状態が基準</tspan></text><path d="M294 945 H346" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="894" width="270" height="102" rx="2" fill="#FFFFFF"/><text x="481" y="936" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">履歴・派生索引</tspan><tspan x="481" dy="34">状態から記録・再構築</tspan></text><text x="320" y="1042" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">復旧はDB復元 + 処理結果の照合</tspan></text><text x="320" y="1108" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">比較：イベントソーシングの考え方</tspan></text><rect x="24" y="1142" width="270" height="102" rx="2" fill="#EEF3FD"/><text x="159" y="1184" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">順序付きイベント</tspan><tspan x="159" dy="34">全変更を記録</tspan></text><path d="M294 1193 H346" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="1142" width="270" height="102" rx="2" fill="#EEF3FD"/><text x="481" y="1184" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">Replay → 状態</tspan><tspan x="481" dy="34">イベントから再構築</tspan></text><text x="320" y="1300" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">下段は理論の比較。現行の採用宣言ではない</tspan></text></g></svg>
