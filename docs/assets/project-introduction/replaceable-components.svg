<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1348" viewBox="0 0 640 1348" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Business contracts outside components</title><desc id="desc">Business code uses a Port with replaceable Adapters. A CQRS reading separates Commands from Queries and rebuilds a derived read index from current Objects. Canonical records and the index are compared in one database and one SQL snapshot; no asynchronous separate read database is assumed.</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#CCCCCC" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#3775E6" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#434343" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1348" rx="2" fill="#FFFFFF"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#3775E6"/><text x="51" y="54" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="500"><tspan x="51" dy="0">03</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#434343" font-size="26" font-weight="600"><tspan x="96" dy="0">Stable business contracts</tspan></text>
<rect x="100" y="110" width="440" height="86" rx="2" fill="#FFFFFF"/><rect x="100" y="110" width="5" height="86" rx="2.5" fill="#3775E6"/><text x="320" y="161" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Business code</tspan></text><path d="M320 196 V242" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="100" y="242" width="440" height="90" rx="2" fill="#EEF3FD"/><rect x="100" y="242" width="5" height="90" rx="2.5" fill="#3775E6"/><text x="320" y="278" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Port</tspan><tspan x="320" dy="34">Platform-owned contract</tspan></text><path d="M320 332 V366 H150 V410" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M320 366 H490 V410" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="410" width="252" height="116" rx="2" fill="#FFFFFF"/><rect x="24" y="410" width="5" height="116" rx="2.5" fill="#3775E6"/><text x="150" y="459" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="150" dy="0">Adapter A</tspan><tspan x="150" dy="34">A: SDK / SQL</tspan></text><rect x="364" y="410" width="252" height="116" rx="2" fill="#FFFFFF"/><rect x="364" y="410" width="5" height="116" rx="2.5" fill="#3775E6"/><text x="490" y="459" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="490" dy="0">Adapter B</tspan><tspan x="490" dy="34">B: SDK / SQL</tspan></text><rect x="24" y="569" width="592" height="72" rx="2" fill="#EEF3FD"/><text x="320" y="613" text-anchor="middle" fill="#3775E6" font-size="24" font-weight="500"><tspan x="320" dy="0">Compare → switch → rollback</tspan></text><text x="320" y="698" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">47 responsibilities, not 47 services</tspan></text>
<path d="M24 748 H616" stroke="#CCCCCC" stroke-width="2"/><text x="320" y="796" text-anchor="middle" fill="#3775E6" font-size="26" font-weight="500"><tspan x="320" dy="0">CQRS: separate write and read</tspan></text><rect x="24" y="832" width="270" height="100" rx="2" fill="#EEF3FD"/><text x="159" y="873" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">Command: write</tspan><tspan x="159" dy="34">submit / approve</tspan></text><rect x="346" y="832" width="270" height="100" rx="2" fill="#EEF3FD"/><text x="481" y="873" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">Query: read</tspan><tspan x="481" dy="34">query / search</tspan></text><path d="M159 932 V998" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M481 932 V998" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="998" width="270" height="112" rx="2" fill="#FFFFFF"/><text x="159" y="1045" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="159" dy="0">Current Objects</tspan><tspan x="159" dy="34">Canonical state</tspan></text><rect x="346" y="998" width="270" height="112" rx="2" fill="#FFFFFF"/><text x="481" y="1045" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="481" dy="0">Derived index</tspan><tspan x="481" dy="34">Read model</tspan></text><path d="M294 1054 H346" fill="none" stroke="#CCCCCC" stroke-width="3" marker-end="url(#line-arrow)"/><text x="320" y="1156" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Rebuild the index from current Objects</tspan></text><rect x="24" y="1190" width="592" height="104" rx="2" fill="#EEF3FD"/><text x="320" y="1233" text-anchor="middle" fill="#434343" font-size="24" font-weight="500"><tspan x="320" dy="0">Compare in one DB / one SQL snapshot</tspan><tspan x="320" dy="34">No asynchronous, separate read DB</tspan></text></g></svg>
