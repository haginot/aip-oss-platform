<svg xmlns="http://www.w3.org/2000/svg" width="640" height="914" viewBox="0 0 640 914" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">TAKTで実装と審査を分ける</title><desc id="desc">目標と設計、実装と機械検査、別セッションの独立審査を進めるTAKTループ。不合格なら原因工程へ戻し、合格なら完了へ進む。入力変更後は過去のPASSを使わない。</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="914" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">07</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">TAKTで実装と審査を分ける</tspan></text>
<rect x="60" y="110" width="520" height="104" rx="16" fill="#ffffff"/><rect x="60" y="110" width="5" height="104" rx="2.5" fill="#244fce"/><text x="320" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">目標・設計・計画</tspan><tspan x="320" dy="34">受入条件と契約を決める</tspan></text><path d="M320 214 V272" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="60" y="272" width="520" height="134" rx="16" fill="#e8edff"/><rect x="60" y="272" width="5" height="134" rx="2.5" fill="#244fce"/><text x="320" y="330" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">実装と機械検査</tspan><tspan x="320" dy="34">店舗デモ / BCP / リリース準備</tspan></text><path d="M320 406 V466" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="60" y="466" width="520" height="104" rx="16" fill="#ffffff"/><rect x="60" y="466" width="5" height="104" rx="2.5" fill="#244fce"/><text x="320" y="526" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">別セッションの独立審査</tspan></text><path d="M320 570 V604 H159 V650" fill="none" stroke="#915a11" stroke-width="3" marker-end="url(#amber-arrow)"/><path d="M320 604 H481 V650" fill="none" stroke="#1c6651" stroke-width="3" marker-end="url(#green-arrow)"/><rect x="24" y="650" width="270" height="104" rx="16" fill="#fff1d7"/><rect x="24" y="650" width="5" height="104" rx="2.5" fill="#915a11"/><text x="159" y="693" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">不合格</tspan><tspan x="159" dy="34">原因の工程に戻る</tspan></text><rect x="346" y="650" width="270" height="104" rx="16" fill="#e6f3ee"/><rect x="346" y="650" width="5" height="104" rx="2.5" fill="#1c6651"/><text x="481" y="693" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">合格</tspan><tspan x="481" dy="34">完了へ進める</tspan></text><rect x="24" y="798" width="592" height="80" rx="14" fill="#e8edff"/><text x="320" y="846" text-anchor="middle" fill="#244fce" font-size="24" font-weight="500"><tspan x="320" dy="0">入力変更後は、過去のPASSを使わない</tspan></text>
</g></svg>
