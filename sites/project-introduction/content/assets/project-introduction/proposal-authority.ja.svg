<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">AIの提案と実行を分ける</title><desc id="desc">信頼できる利用者IDから閲覧可能な情報を取り出し、提案後にAction Engineで実行条件を検査する。製品の実行時AIモデルは未採用。</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="780" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">04</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">AIの提案と実行を分ける</tspan></text>
<rect x="24" y="112" width="180" height="100" rx="16" fill="#ffffff"/><rect x="24" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="114" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="114" dy="0">認証済みの</tspan><tspan x="114" dy="34">利用者ID</tspan></text><path d="M204 162 H250" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="250" y="112" width="366" height="100" rx="16" fill="#ffffff"/><rect x="250" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="433" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="433" dy="0">閲覧を許可された</tspan><tspan x="433" dy="34">情報だけを取得</tspan></text><path d="M433 212 V240 H320 V284" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="135" y="284" width="370" height="104" rx="16" fill="#e8edff"/><rect x="135" y="284" width="5" height="104" rx="2.5" fill="#244fce"/><text x="320" y="327" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">AIによる提案</tspan><tspan x="320" dy="34">実行権限は付かない</tspan></text><path d="M320 388 V470" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><text x="320" y="435" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">提案しただけでは実行しない</tspan></text><rect x="24" y="470" width="592" height="164" rx="16" fill="#e6f3ee"/><rect x="24" y="470" width="5" height="164" rx="2.5" fill="#1c6651"/><text x="320" y="526" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">Action Engineで再検査</tspan><tspan x="320" dy="34">権限・委任 / 更新版・承認</tspan><tspan x="320" dy="34">同じ要求の再送判定</tspan></text><rect x="24" y="674" width="592" height="72" rx="14" fill="#fff1d7"/><text x="320" y="718" text-anchor="middle" fill="#915a11" font-size="24" font-weight="500"><tspan x="320" dy="0">製品の実行時AIモデルは未採用</tspan></text>
</g></svg>
