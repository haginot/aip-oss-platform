<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1206" viewBox="0 0 640 1206" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">成功したのに、応答がない</title><desc id="desc">Object、Action、Outboxを同じローカルトランザクションで確定してから外部ERPへ送る。外部成功後の応答消失はUNKNOWNに保ち、操作IDと入力ダイジェストで照合する。同じIDと入力には既存の結果を返し、違う入力は拒否する。</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1206" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">05</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">成功したのに、応答がない</tspan></text>
<rect x="24" y="110" width="592" height="126" rx="16" fill="#e8edff"/><rect x="24" y="110" width="5" height="126" rx="2.5" fill="#244fce"/><text x="320" y="147" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">同じローカルトランザクション</tspan><tspan x="320" dy="34">Object更新 + Action記録</tspan><tspan x="320" dy="34">外部送信待ちのOutbox</tspan></text><path d="M320 236 V286" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="100" y="286" width="440" height="108" rx="16" fill="#e6f3ee"/><rect x="100" y="286" width="5" height="108" rx="2.5" fill="#1c6651"/><text x="320" y="331" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">外部ERPで処理が完了</tspan><tspan x="320" dy="34">送信はローカル確定のあと</tspan></text><path d="M320 394 V444" fill="none" stroke="#915a11" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#amber-arrow)"/><rect x="24" y="444" width="592" height="84" rx="14" fill="#fff1d7"/><text x="320" y="494" text-anchor="middle" fill="#915a11" font-size="24" font-weight="500"><tspan x="320" dy="0">応答だけが消える → UNKNOWN</tspan></text><text x="320" y="578" text-anchor="middle" fill="#915a11" font-size="24" font-weight="500"><tspan x="320" dy="0">無条件に再送しない</tspan></text><path d="M320 592 V624" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="624" width="592" height="104" rx="16" fill="#ffffff"/><rect x="24" y="624" width="5" height="104" rx="2.5" fill="#244fce"/><text x="320" y="667" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">外部の記録を照合</tspan><tspan x="320" dy="34">操作ID + 入力ダイジェスト</tspan></text><text x="320" y="782" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">記録を確認できなければ、不明のまま</tspan></text>
<path d="M24 832 H616" stroke="#d9e0e8" stroke-width="2"/><text x="320" y="880" text-anchor="middle" fill="#244fce" font-size="26" font-weight="500"><tspan x="320" dy="0">冪等性：同じ依頼を見分ける</tspan></text><rect x="24" y="914" width="592" height="96" rx="16" fill="#e8edff"/><text x="320" y="953" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">操作IDは固定する</tspan><tspan x="320" dy="34">同じIDで入力を変えてはいけない</tspan></text><path d="M320 1010 V1036 H159 V1062" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M320 1036 H481 V1062" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="1062" width="270" height="102" rx="16" fill="#e6f3ee"/><text x="159" y="1104" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">同じID・同じ入力</tspan><tspan x="159" dy="34">既存の結果を返す</tspan></text><rect x="346" y="1062" width="270" height="102" rx="16" fill="#fff1d7"/><text x="481" y="1104" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">同じID・違う入力</tspan><tspan x="481" dy="34">競合として拒否</tspan></text></g></svg>
