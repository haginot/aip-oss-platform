<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1346" viewBox="0 0 640 1346" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Stop, restore, then verify</title><desc id="desc">BCP exercises classify success, not executed, conflict, and unknown, and measure loss, duplicates, RPO, and RTO. The current stored-state, history, and index approach is contrasted with the theoretical Event Sourcing model, which replays ordered events to rebuild state. The lower row is not an adoption claim.</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1346" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">06</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">Stop, restore, then verify</tspan></text>
<rect x="24" y="112" width="270" height="112" rx="16" fill="#fff1d7"/><rect x="24" y="112" width="5" height="112" rx="2.5" fill="#915a11"/><text x="159" y="159" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">Disconnect / stop</tspan><tspan x="159" dy="34">Inject a failure</tspan></text><path d="M294 168 H346" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="112" width="270" height="112" rx="16" fill="#ffffff"/><rect x="346" y="112" width="5" height="112" rx="2.5" fill="#244fce"/><text x="481" y="159" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">Restart / restore</tspan><tspan x="481" dy="34">Read restored state</tspan></text><path d="M481 224 V255 H159 V304" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M481 255 V304" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="304" width="270" height="104" rx="16" fill="#e6f3ee"/><rect x="24" y="304" width="5" height="104" rx="2.5" fill="#1c6651"/><text x="159" y="347" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">Success</tspan><tspan x="159" dy="34">Done, confirmed</tspan></text><rect x="346" y="304" width="270" height="104" rx="16" fill="#ffffff"/><rect x="346" y="304" width="5" height="104" rx="2.5" fill="#244fce"/><text x="481" y="347" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">Not executed</tspan><tspan x="481" dy="34">No effect confirmed</tspan></text><rect x="24" y="436" width="270" height="104" rx="16" fill="#fff1d7"/><rect x="24" y="436" width="5" height="104" rx="2.5" fill="#915a11"/><text x="159" y="479" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">Conflict</tspan><tspan x="159" dy="34">State differs</tspan></text><rect x="346" y="436" width="270" height="104" rx="16" fill="#fff1d7"/><rect x="346" y="436" width="5" height="104" rx="2.5" fill="#915a11"/><text x="481" y="479" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">Unknown</tspan><tspan x="481" dy="34">Keep unresolved</tspan></text><text x="320" y="277" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">Classify recovery outcomes</tspan></text><rect x="24" y="582" width="592" height="80" rx="14" fill="#e8edff"/><text x="320" y="630" text-anchor="middle" fill="#244fce" font-size="24" font-weight="500"><tspan x="320" dy="0">Loss / duplicates / unresolved / RPO / RTO</tspan></text><text x="320" y="708" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">Local exercise, not a production SLA</tspan></text>
<path d="M24 758 H616" stroke="#d9e0e8" stroke-width="2"/><text x="320" y="806" text-anchor="middle" fill="#244fce" font-size="26" font-weight="500"><tspan x="320" dy="0">History is not Event Sourcing</tspan></text><text x="320" y="860" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">Current implementation: stored state</tspan></text><rect x="24" y="894" width="270" height="102" rx="16" fill="#e8edff"/><text x="159" y="936" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">Objects</tspan><tspan x="159" dy="34">Canonical state</tspan></text><path d="M294 945 H346" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="894" width="270" height="102" rx="16" fill="#ffffff"/><text x="481" y="936" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">History / index</tspan><tspan x="481" dy="34">Record / rebuild</tspan></text><text x="320" y="1042" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">Recovery = DB restore + reconciliation</tspan></text><text x="320" y="1108" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">Contrast: the Event Sourcing model</tspan></text><rect x="24" y="1142" width="270" height="102" rx="16" fill="#e6f3ee"/><text x="159" y="1184" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">Ordered events</tspan><tspan x="159" dy="34">Record all changes</tspan></text><path d="M294 1193 H346" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="346" y="1142" width="270" height="102" rx="16" fill="#e6f3ee"/><text x="481" y="1184" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">Replay → state</tspan><tspan x="481" dy="34">Rebuild from events</tspan></text><text x="320" y="1300" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">Lower row: theory, not an adoption claim</tspan></text></g></svg>
