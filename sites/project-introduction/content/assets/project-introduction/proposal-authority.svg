<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Separate proposals from execution</title><desc id="desc">A trusted identity scopes readable evidence before a proposal; the Action Engine checks execution conditions afterward. No product-runtime AI model is adopted.</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="780" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">04</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">Separate proposals from execution</tspan></text>
<rect x="24" y="112" width="180" height="100" rx="16" fill="#ffffff"/><rect x="24" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="114" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="114" dy="0">Trusted</tspan><tspan x="114" dy="34">user identity</tspan></text><path d="M204 162 H250" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="250" y="112" width="366" height="100" rx="16" fill="#ffffff"/><rect x="250" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="433" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="433" dy="0">Retrieve only</tspan><tspan x="433" dy="34">authorized evidence</tspan></text><path d="M433 212 V240 H320 V284" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="135" y="284" width="370" height="104" rx="16" fill="#e8edff"/><rect x="135" y="284" width="5" height="104" rx="2.5" fill="#244fce"/><text x="320" y="327" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">Proposal</tspan><tspan x="320" dy="34">No execution authority</tspan></text><path d="M320 388 V470" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><text x="320" y="435" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">A proposal does not execute an Action</tspan></text><rect x="24" y="470" width="592" height="164" rx="16" fill="#e6f3ee"/><rect x="24" y="470" width="5" height="164" rx="2.5" fill="#1c6651"/><text x="320" y="526" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">Action Engine checks again</tspan><tspan x="320" dy="34">Permissions / delegation / revisions</tspan><tspan x="320" dy="34">Approval / request deduplication</tspan></text><rect x="24" y="674" width="592" height="72" rx="14" fill="#fff1d7"/><text x="320" y="718" text-anchor="middle" fill="#915a11" font-size="24" font-weight="500"><tspan x="320" dy="0">No product-runtime AI model adopted</tspan></text>
</g></svg>
