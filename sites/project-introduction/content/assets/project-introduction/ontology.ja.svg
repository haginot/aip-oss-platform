<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1124" viewBox="0 0 640 1124" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">Ontologyは、型と関係</title><desc id="desc">店舗、ロット、在庫のObjectとSetIsolation Actionを結び、DDDのユビキタス言語と更新版の照合を示す。期待r7と現在r7なら条件を検査し、現在r8なら競合として拒否する。</desc>
<defs><marker id="line-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a6b4c3" stroke-width="2"/></marker><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#244fce" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1c6651" stroke-width="2"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#915a11" stroke-width="2"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="1124" rx="20" fill="#f2f5f8"/>
<rect x="24" y="24" width="54" height="42" rx="10" fill="#244fce"/><text x="51" y="54" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="500"><tspan x="51" dy="0">02</tspan></text>
<text x="96" y="54" text-anchor="start" fill="#142338" font-size="26" font-weight="600"><tspan x="96" dy="0">Ontologyは、型と関係</tspan></text>
<rect x="24" y="112" width="250" height="100" rx="16" fill="#ffffff"/><rect x="24" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="149" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="149" dy="0">店舗Object</tspan><tspan x="149" dy="34">例：店舗A</tspan></text><rect x="366" y="112" width="250" height="100" rx="16" fill="#ffffff"/><rect x="366" y="112" width="5" height="100" rx="2.5" fill="#244fce"/><text x="491" y="153" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="491" dy="0">ロットObject</tspan><tspan x="491" dy="34">例：ロットL1</tspan></text><path d="M149 212 V250 H260 V310" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><path d="M491 212 V250 H380 V310" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><text x="149" y="289" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="149" dy="0">在庫を持つ</tspan></text><text x="491" y="289" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="491" dy="0">回収対象</tspan></text><rect x="130" y="310" width="380" height="126" rx="16" fill="#e8edff"/><rect x="130" y="310" width="5" height="126" rx="2.5" fill="#244fce"/><text x="320" y="347" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">在庫Object</tspan><tspan x="320" dy="34">店舗A × ロットL1</tspan><tspan x="320" dy="34">期待する更新版：r7</tspan></text><path d="M320 436 V492" fill="none" stroke="#a6b4c3" stroke-width="3" marker-end="url(#line-arrow)"/><rect x="24" y="492" width="592" height="100" rx="14" fill="#e8edff"/><text x="320" y="533" text-anchor="middle" fill="#244fce" font-size="24" font-weight="500"><tspan x="320" dy="0">在庫隔離Action</tspan><tspan x="320" dy="34">SetIsolation</tspan></text><text x="320" y="647" text-anchor="middle" fill="#43556c" font-size="24" font-weight="500"><tspan x="320" dy="0">同じ型と関係をAPI・業務ルールで使う</tspan></text>
<path d="M24 690 H616" stroke="#d9e0e8" stroke-width="2"/><text x="320" y="738" text-anchor="middle" fill="#244fce" font-size="26" font-weight="500"><tspan x="320" dy="0">DDDで説明すると</tspan></text><rect x="24" y="768" width="592" height="110" rx="16" fill="#e8edff"/><text x="320" y="814" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">業務で使う言葉 = 型・APIの言葉</tspan><tspan x="320" dy="34">ユビキタス言語を意識したモデル</tspan></text><text x="320" y="926" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="320" dy="0">更新版の照合：古い前提を通さない</tspan></text><rect x="24" y="960" width="270" height="114" rx="16" fill="#e6f3ee"/><text x="159" y="1008" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="159" dy="0">期待 r7 / 現在 r7</tspan><tspan x="159" dy="34">条件を検査して更新</tspan></text><rect x="346" y="960" width="270" height="114" rx="16" fill="#fff1d7"/><text x="481" y="1008" text-anchor="middle" fill="#142338" font-size="24" font-weight="500"><tspan x="481" dy="0">期待 r7 / 現在 r8</tspan><tspan x="481" dy="34">競合として拒否</tspan></text></g></svg>
