<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>購買稟議</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;color:#132e3b}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:8px}input,textarea{min-width:360px}button{margin:4px;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:8px;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{padding:16px;border:1px solid #ccc;margin:16px 0}#message{white-space:pre-wrap;color:#7e2700}</style>
<h1>購買稟議・見積比較・発注</h1><a href="/login">ログイン</a> / <a href="/">業務一覧</a><p id="identity"></p><p role="status" id="message"></p>
<main id="workspace" hidden>
<section><h2>購買申請</h2><form id="create"><label>申請ID <input id="new-id" required></label><label>購買目的 <input id="title" required></label><label>予算ID <input id="budget" required></label><label>通貨 <select id="currency"><option>JPY</option><option>USD</option><option>EUR</option></select></label><fieldset id="create-quantity" hidden disabled><legend>数量契約 1.1.0・単一明細</legend><label>発注数量 <input id="quantity" type="number" step="1" required></label><label>単位 <input id="unit" maxlength="40" required></label></fieldset><button>申請を保存</button></form></section>
<section><h2>申請一覧</h2><button id="reload">再読込</button><div id="cases"></div><label>申請ID <input id="target"></label><button id="open">開く</button></section>
<section id="detail" hidden><h2>見積比較と進捗</h2><p id="state"></p><div id="summary"></div><ul id="approvals"></ul><table><thead><tr><th>見積ID</th><th>仕入先ID</th><th>総額</th><th>通貨</th><th>数量</th><th>単位</th><th>見積版</th></tr></thead><tbody id="quotes"></tbody></table>
<form id="quote"><h3>見積を追加</h3><label>見積ID <input id="quote-id" required></label><label>登録済み仕入先ID <input id="supplier" required></label><label>数量全体の総額（最小通貨単位） <input id="amount" type="number" step="1" required></label><fieldset id="quote-quantity" hidden disabled><legend>同一仕様の相見積</legend><label>見積数量 <input id="quote-quantity-value" type="number" step="1" required></label><label>見積単位 <input id="quote-unit" maxlength="40" required></label><label>見積版 <input id="quote-version" type="number" step="1" required></label></fieldset><button>見積を保存</button></form>
<form id="selection"><h3>比較・選定</h3><label>選定見積ID <input id="chosen" required></label><label>選定理由 <textarea id="reason" required></textarea></label><button>選定を保存</button></form>
<h3>承認と発注</h3><button id="approve">承認</button><button id="return">差戻し</button><button id="cancel">申請取消</button><button id="dispatch">発注</button><button id="reconcile">外部結果照合</button>
<h3>受領</h3><form id="receive"><label>全量受領の確認 <input id="receipt-note" required></label><fieldset id="receive-quantity" hidden disabled><legend>独立全量検収</legend><label>実検収数量 <input id="received-quantity" type="number" step="1" required></label><label>検収単位 <input id="received-unit" maxlength="40" required></label></fieldset><button>受領を記録</button></form><p>受領担当者は申請者・承認者と異なる本人を指定します。</p>
<h3>永続履歴</h3><ol id="history"></ol><button id="audit">監査を表示</button><pre id="audit-result"></pre></section></main><script type="module" src="/procurement.mjs"></script></html>
