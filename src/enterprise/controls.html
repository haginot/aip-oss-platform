<!doctype html><html lang="ja"><meta charset="utf-8"><title>情報・公開・権利・部門連携</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f5f7fa;color:#183048}nav,section{background:white;padding:1rem;margin:1rem 0;border-radius:8px}label{display:inline-block;margin:.5rem}input,select,button{padding:.5rem;margin:.2rem}button{cursor:pointer}#message{padding:1rem;background:#e9eff5;white-space:pre-wrap}#detail{white-space:pre-wrap}li{padding:.4rem} [hidden]{display:none!important}</style><body><a href="/">案件へ戻る</a><h1>情報・公開・権利・部門連携</h1><p id="identity"></p><nav><label>業務<select id="kind"><option value="information">情報分類</option><option value="right">同意・利用権</option><option value="release">対外公開</option><option value="journey">部門間引継ぎ</option></select></label><button id="refresh">再読込み</button></nav><p id="message" role="status" aria-live="polite"></p><main id="workspace" hidden>
<section><h2>新規登録</h2><form id="create"><label>管理ID<input id="new-id" required></label><label id="creation-scope-label" hidden>新規台帳・引継ぎの登録先<select id="creation-scope"></select></label><p>情報分類と対外公開は、選択した元案件・元情報の法人・部門・案件を引き継ぎます。</p>
<div data-kind="information"><label>元の案件<select id="object"></select></label><label>分類<select id="label"><option>CONFIDENTIAL</option><option>STRICT</option><option>INTERNAL</option><option>PUBLIC</option></select></label></div>
<div data-kind="right"><label>合成対象者<input id="subject" value="synthetic-subject"></label><label>素材<input id="material" value="synthetic-material"></label><label>証拠版<input id="evidence" value="fixture-v1"></label><label>期限<input id="expires" value="2099-01-01T00:00:00Z"></label></div>
<div data-kind="release"><label>分類済み情報<select id="source"></select></label><label>対象者<input id="release-subject" value="synthetic-subject"></label><label>利用権（根拠素材ごとに選択）<select id="right" multiple></select></label><label>解禁時刻<input id="embargo" value="2020-01-01T00:00:00Z"></label><label>媒体<select id="channels"><option value="web">合成Web</option><option value="mail">合成メール（撤回不可）</option><option value="both">両媒体</option></select></label><label>訂正元ID（任意）<input id="correction"></label></div>
<div data-kind="journey"><label>業務経路<select id="flow"><option>lead-to-cash</option><option>procure-to-pay</option><option>hire-to-retire</option><option>incident-to-resolution</option></select></label></div><button type="submit">登録</button></form></section>
<section><h2>登録済み</h2><ul id="records"></ul><label>対象ID<input id="target"></label><button id="open">表示</button><p id="state"></p><pre id="detail"></pre><h3>権限内の進捗履歴</h3><p>操作名と版を表示します。操作主体などの詳細は監査権限で取得してください。</p><ul id="history"></ul><h3>監査記録</h3><button id="audit">権限内の監査を表示</button><pre id="audit-records" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section>
<section id="actions"><h2>操作</h2><div data-kind="information"><label>派生先ID<input id="derived"></label><label>変換<select id="transform"><option value="search">検索用</option><option value="aggregate">3件以上を集計</option><option value="ai">AI提案</option><option value="export">出力用</option><option value="notification">通知用</option></select></label><label>集計・派生の根拠（複数選択可）<select id="parents" multiple></select></label><button id="derive">分類を保持して派生</button><p>集計は異なる根拠3件以上が必要です。通知用データは公開承認前に送信されません。</p></div>
<div data-kind="right"><button id="revoke">同意・権利を撤回</button><button id="check">日本向けWeb利用を検査</button></div>
<div data-kind="release"><label>審査役割<select id="role"><option value="legal">法務</option><option value="pr">広報</option><option value="ir">IR</option></select></label><button id="approve">承認</button><button id="withdraw">撤回申請</button><label>対象媒体<select id="channel"><option>web</option><option>mail</option></select></label><button id="dispatch">配信</button><button id="reconcile">照合</button><button id="reverse">承認済み撤回を実行</button><p>媒体によって撤回できない既配信物が残ります。合成環境のみ接続しています。</p></div>
<div data-kind="journey"><label>引継ぎ先部門<input id="department" value="synthetic-hr"></label><label>参照番号<input id="reference" value="synthetic-reference"></label><label>依頼内容<input id="task" value="合成・責任移管"></label><button id="offer">引継ぎ依頼</button><button id="accept">受入承認</button><button id="reject">受入拒否</button><button id="cancel">中止</button><label>復旧対象の工程<select id="step"></select></label><p id="step-status"></p><pre id="step-detail" style="white-space:pre-wrap"></pre><button id="compensation">補償を承認</button><button id="step-dispatch">受入済み工程を実行</button><button id="step-reconcile">工程結果を照合</button><button id="step-reverse">補償を実行</button></div></section></main><script type="module" src="/controls.mjs"></script></body></html>
