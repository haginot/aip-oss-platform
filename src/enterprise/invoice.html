<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>請求書照合・支払承認</title><style>body{font:16px sans-serif;max-width:1000px;margin:24px auto;background:#f7f8fa;color:#182332}fieldset{margin:12px 0;background:white;border:1px solid #ccd5df}label{display:inline-block;margin:6px}input,select,button{font:inherit;padding:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}#message{color:#8b2600}</style><script type="module" src="/invoice.mjs"></script></head><body><h1>請求書照合・支払承認</h1><p>ローカル合成データ専用・実送金なし</p><p id="identity"></p><a href="/login">担当者を切替</a> <a href="/procurement">発注・独立検収</a><p id="message" role="status"></p>
<form id="import"><fieldset><legend>請求書取込・例外訂正</legend>
<label>請求ID <input id="invoice-id" required></label><label>発注ID <input id="purchase-id" required></label><label>請求番号 <input id="number" required></label><label>仕入先 <input id="supplier-id" required></label><label>請求額（最小通貨単位）<input id="amount" type="number" required></label><label>通貨 <select id="currency"><option>JPY</option><option>USD</option><option>EUR</option></select></label><label>数量 <input id="quantity" type="number" required></label><label>単位 <input id="unit" required></label><button type="submit">取込</button><button id="correct" type="button">現在版を訂正して再照合</button></fieldset></form>
<form id="account"><fieldset><legend>合成口座（版管理）</legend><label>口座ID <input id="account-id" required></label><label>合成参照 <input id="account-reference" placeholder="synthetic:local-bank"></label><label>口座版 <input id="account-revision" type="number"></label><button type="submit">口座登録・変更</button></fieldset></form>
<form id="request"><fieldset><legend>支払申請</legend><label>支払ID <input id="payment-id" required></label><label>支払額 <input id="payment-amount" type="number" required></label><button type="submit">照合済請求から申請</button></fieldset></form>
<fieldset><legend>参照・承認・結果照合</legend><label>請求ID <input id="invoice-target"></label><button id="open-invoice">請求を開く</button><label>支払ID <input id="payment-target"></label><button id="open-payment">支払を開く</button><button id="reload">再読込</button><button id="approve">承認</button><button id="return">差戻し</button><button id="cancel">送信前取消</button><button id="dispatch">合成支払送信</button><button id="reconcile">結果照合（再送なし）</button></fieldset>
<ul id="cases"></ul><section id="detail" hidden><h2>照合・支払状況</h2><pre id="summary"></pre><ol id="approvals"></ol><ol id="history"></ol></section></body></html>
