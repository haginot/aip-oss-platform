<!doctype html><html lang="ja"><meta charset="utf-8"><title>資源・期限・適用管理</title><style>body{font:16px system-ui;background:#f3f6fa;max-width:1000px;margin:30px auto;color:#18334b}section{background:white;padding:24px;margin:20px 0}label{display:inline-block;margin:12px}input,select,button{font:inherit;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{padding:16px;background:#e1eaf2}</style><a href="/">案件へ戻る</a><h1>資源・期限・適用管理</h1><p id="identity"></p><p>合成環境。緊急操作はこの案件の期限対応に限定し、恒久的な権限は付与しません。ポリシー適用は法適合の保証ではありません。</p><p id="message" role="status"></p><section><label>業務<select id="kind"><option value="resource">予算・予約</option><option value="sla">期限・緊急操作</option><option value="policy">会社別ポリシー</option><option value="coverage">業務網羅性</option></select></label><button id="reload">再読込み</button><form id="create"><label>管理ID<input id="new-id" required></label><div data-kind="resource"><label>通貨<select id="currency"><option>JPY</option><option>USD</option><option>EUR</option></select></label><label>単位<select id="unit"><option value="minor">通貨最小単位</option><option value="item">個</option><option value="hour">時間</option></select></label><label>容量<input id="capacity" type="number" value="1000"></label><label>期間累積上限<input id="threshold" type="number" value="800"></label><label>締め日時<input id="periodEnd" value="2099-01-01T00:00:00Z"></label></div><div data-kind="sla" hidden><label>優先度<select id="priority"><option>NORMAL</option><option>URGENT</option></select></label><label>営業日数<input id="days" type="number" value="2"></label><label>休日（カンマ区切り）<input id="holidays"></label><p>時計はUTC、営業日は月〜金です。</p></div><div data-kind="policy" hidden><label>法域<input id="jurisdiction" value="SYNTHETIC-JP"></label><label>業種<input id="industry" value="synthetic"></label><label>版<input id="version" value="1.0.0"></label><label>施行日時<input id="effective" value="2020-01-01T00:00:00Z"></label><label>失効日時<input id="expires" value="2099-01-01T00:00:00Z"></label><label>根拠<input id="evidence" value="synthetic-rulebook"></label><label>責任者<input id="owner" value="reviewer"></label><label>要件（カンマ区切り）<input id="requirements" value="approval,retention"></label></div><div data-kind="coverage" hidden><label>部門<input id="departments" value="corporate,hr"></label><label>ライフサイクル<input id="lifecycles" value="start,close"></label><label>情報区分<input id="classifications" value="CONFIDENTIAL"></label><label>外部効果<input id="effects" value="none"></label><label>例外<input id="exceptions" value="restart"></label><p>各欄はカンマ区切り。全組合せを未対応のローカルIssueとして登録します。</p></div><button>登録</button></form></section><section><h2>登録済み</h2><ul id="records"></ul><label>対象ID<input id="target"></label><button id="open">表示</button><h2 id="state"></h2><pre id="detail"></pre><h3>履歴</h3><ul id="history"></ul><button id="audit">監査権限で証跡を表示</button><pre id="audit-detail"></pre></section><section><h2>操作</h2><div data-action="resource"><label>予約参照<input id="reference" value="order-1"></label><label>数量<input id="quantity" type="number" value="100"></label><button id="reserve">予約</button><button id="release">予約解除</button><button id="close">締める</button></div><div data-action="sla" hidden><label>理由<input id="reason" value="合成障害への対応"></label><label>緊急権限の失効日時<input id="emergency-expiry"></label><button id="emergency-request">緊急操作を申請</button><button id="emergency-approve">独立承認</button><button id="emergency-use">緊急操作</button><button id="emergency-review">事後独立レビュー</button><button id="tick">期限検査</button></div><div data-action="policy" hidden><button id="policy-approve">責任者として審査</button><button id="policy-apply">表示版の要件を適用</button></div><div data-action="coverage" hidden><button id="coverage-check">未対応を確認</button><label>適用除外Issue<input id="issue"></label><label>除外根拠<input id="exclusion"></label><button id="exclude">独立審査して除外</button><label>新業務ライフサイクル<input id="new-life" value="transfer"></label><button id="discover">新業務を登録</button></div></section><script type="module" src="/assurance.mjs"></script></html>
