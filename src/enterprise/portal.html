<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企業ワークフロー — ローカル検証</title>
<style>body{font:16px system-ui;max-width:1050px;margin:40px auto;padding:0 20px;color:#182635;background:#f4f7fa}header,section{background:white;padding:24px;border-radius:10px;margin-bottom:20px}h1{margin-top:0}label{display:block;margin:12px 0}input,textarea,select,button{font:inherit;padding:8px}input,textarea{display:block;width:95%;box-sizing:border-box}button,a{margin:6px}button{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#message{white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#526477}</style>
<header><h1>企業ワークフロー</h1><p class="muted">合成データによるローカル検証。外部送信先は独立した検証サーバーです。</p><a href="/procurement">購買稟議・見積比較・発注</a><a href="/admin">定義と承認ポリシーを管理</a><a href="/assurance">資源・期限・適用管理</a> <a href="/controls">情報・公開・利用権・部門間引継ぎ</a><p id="identity">ログインしてください。</p><a href="/login">アカウントを選んでログイン</a><button id="logout" hidden>ログアウト</button></header>
<p id="message" role="status" aria-live="polite"></p>
<main hidden id="workspace"><section><h2>申請を作成</h2><form id="create"><label>認可された組織スコープ<select id="scope"></select></label><div id="fields"></div><button>申請を保存</button></form></section>
<section><h2>案件一覧</h2><button id="reload">再読込み</button><table><thead><tr><th>件名</th><th>ID</th><th>詳細</th></tr></thead><tbody id="cases"></tbody></table></section>
<section id="detail" hidden><h2>案件と承認状況</h2><div id="record"></div><button data-operation="vote" data-decision="APPROVE">承認</button><button data-operation="vote" data-decision="RETURN">差戻し</button><button data-operation="cancel">取消</button><button data-operation="dispatch">検証先へ実行</button><button data-operation="reconcile">外部結果を照合</button><button data-operation="compensate">補償を実行</button><button id="history">履歴</button>
<h3>AI提案（任意）</h3><p>認可された件名のみを合成モデルへ渡します。提案は承認や外部実行を行いません。</p><button id="propose">件名の要約を提案</button><pre id="proposal"></pre><h3>接続先</h3><p>承認前に接続先を固定してください。Google / Microsoft と本番SaaSは未接続です。</p><select id="connection"></select><button id="route">接続先を固定</button>
<h3>文書</h3><form id="document-upload"><label>文書ID（同じIDは新しい版）<input id="document-id" required></label><label>ファイル名<input id="document-name" required value="synthetic.txt"></label><label>分類<select id="document-class"><option>RESTRICTED</option><option>CONFIDENTIAL</option><option>INTERNAL</option></select></label><label>保持日数<input id="document-days" type="number" value="1" min="1" required></label><label>合成テキスト<textarea id="document-content" required></textarea></label><button>検査して保存</button></form>
<label>文書を検索<input id="document-query"></label><button id="document-search">検索</button><table><thead><tr><th>文書</th><th>版・状態</th><th>保持期限</th><th>操作</th></tr></thead><tbody id="documents"></tbody></table><pre id="document-preview"></pre>
<h3>監査</h3><button id="audit-export">監査を表示・出力</button><pre id="audit-result"></pre></section></main>
<script type="module" src="/portal.mjs"></script></html>
