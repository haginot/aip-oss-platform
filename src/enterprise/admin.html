<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務定義の管理</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:20px;background:#f4f7fa;color:#182635}section{background:white;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:8px}button{margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{min-height:32px}</style><h1>業務定義と承認ポリシー</h1><a href="/">案件一覧へ</a><a href="/login">アカウントを選ぶ</a><p id="identity"></p><p id="message" role="status" aria-live="polite"></p><main id="admin" hidden><section><h2>版を作成</h2><p>公開済み案件の版は変わりません。新しい版は別の担当者による審査が必要です。</p><form id="draft"><label>元の版<select id="base"></select></label><label>新しい版<input id="version" required placeholder="2.0.0"></label><label>件名の表示名<input id="label" required maxlength="80" value="件名"></label><label>期限（営業日）<input id="days" type="number" min="1" max="30" value="2" required></label><label>最初の段階の必要承認数<input id="quorum" type="number" min="1" max="2" value="2" required></label><button>下書きを保存</button></form></section><section><h2>差分・検証・公開</h2><p id="live"></p><label>対象の版<select id="target"></select></label><button id="simulate">差分と検証結果</button><button id="review">別担当者として審査</button><button id="publish">公開／旧版へ戻す</button><pre id="result"></pre></section><section><h2>操作履歴</h2><button id="reload">再読込み</button><ul id="history"></ul></section></main><script type="module" src="/admin.mjs"></script></html>
