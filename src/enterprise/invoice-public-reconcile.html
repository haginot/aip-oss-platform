<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>支払結果の照合</title>
<style>body{font:16px sans-serif;max-width:900px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}select,button{font:inherit;padding:.5rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:22rem;overflow:auto}button{margin:.4rem}:focus-visible{outline:3px solid #1464c0}</style>
<h1>支払結果の照合</h1><p>既存の支払を選び、結果が不明な支払だけを明示的に照合します。照合による送金の再送は行いません。</p>
<p id="identity"></p><p id="message" role="status" aria-live="polite"></p>
<button id="refresh" type="button">現在の情報・参照権限を確認</button>
<form id="reconcile-form"><label>支払ID<select id="payment-id" required aria-label="支払ID"></select></label><button id="load" type="button">選択した支払を読み込む</button><button id="reconcile" type="submit" disabled>支払結果を照合する</button></form>
<section id="result" hidden><h2 id="result-title" tabindex="-1">照合結果</h2><p id="observation"></p></section>
<section id="case-detail" hidden><h2 id="detail-title" tabindex="-1">現在の支払</h2><p id="state"></p><pre id="summary"></pre><h3>操作履歴</h3><pre id="history"></pre></section>
<script type="module" src="/enterprise/ENT-202-reconcile.mjs"></script></html>
